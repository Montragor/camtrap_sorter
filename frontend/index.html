<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>camtrap-sorter-aws</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    button {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Wildkamera-Bilder hochladen</h2>
    <input type="file" id="fileInput" accept="image/jpeg" multiple>
    <br>
    <button id="uploadButton">Hochladen</button>
    <div id="status"></div>
  </div>

  <script>
    document.getElementById("uploadButton").addEventListener("click", () => {
      const files = document.getElementById("fileInput").files;
      if (files.length === 0) {
        document.getElementById("status").textContent = "Bitte zuerst Dateien auswählen.";
        return;
      }
      // Platzhalter: eigentliche Upload-Logik kommt im nächsten Todo dazu
      document.getElementById("status").textContent = `${files.length} Datei(en) ausgewählt, Upload-Logik folgt.`;
    });
  </script>
</body>
</html>
