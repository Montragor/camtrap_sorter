<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>camtrap-sorter-aws</title>
  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1691.0.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    button {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Wildkamera-Bilder hochladen</h2>
    <input type="file" id="fileInput" accept="image/jpeg" multiple>
    <br>
    <button id="uploadButton">Hochladen</button>
    <div id="status"></div>
  </div>

  <script>
    const IDENTITY_POOL_ID = "eu-central-1:47c31f5c-d051-48ca-b3d6-c089d75b7062";
    const REGION = "eu-central-1";
    const RAW_BUCKET = "camtrap-sorter-raw";

    AWS.config.region = REGION;
    AWS.config.credentials = new AWS.CognitoIdentityCredentials({
      IdentityPoolId: IDENTITY_POOL_ID,
    });

    const s3 = new AWS.S3({ apiVersion: "2006-03-01" });

    document.getElementById("uploadButton").addEventListener("click", async () => {
      const files = document.getElementById("fileInput").files;
      const statusEl = document.getElementById("status");

      if (files.length === 0) {
        statusEl.textContent = "Bitte zuerst Dateien auswählen.";
        return;
      }

      statusEl.textContent = "Lade hoch...";

      try {
        for (const file of files) {
          const params = {
            Bucket: RAW_BUCKET,
            Key: file.name,
            Body: file,
            ContentType: file.type,
          };
          await s3.putObject(params).promise();
        }

        statusEl.textContent = `${files.length} Datei(en) erfolgreich hochgeladen.`;
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Fehler beim Hochladen. Details in der Browser-Konsole.";
      }
    });
  </script>
</body>
</html>
